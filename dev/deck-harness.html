<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tacet: two deck graph harness</title>
<style>
  :root { color-scheme: dark; --ink: hsla(0,0%,100%,0.92); --dim: hsla(0,0%,100%,0.55); }
  body { margin: 0; padding: 32px; background: #0b0b0d; color: var(--ink);
         font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: var(--dim); margin: 0 0 20px; }
  button { background: hsl(45,100%,56%); color: #111; border: 0; border-radius: 999px;
           padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  canvas { display: block; background: #131318; border-radius: 10px; margin: 20px 0; }
  pre { background: #131318; padding: 14px; border-radius: 10px; overflow: auto; color: var(--dim); }
  .ok { color: hsl(140,60%,60%); } .bad { color: hsl(0,70%,65%); }
</style>
</head>
<body>
<h1>Two deck graph</h1>
<p class="sub">Drives the real <code>createPlaybackGraph</code> against a real AudioContext, then samples what the audio thread actually applied to each deck's gain.</p>
<button id="run">Run crossfade</button>
<canvas id="plot" width="880" height="240"></canvas>
<pre id="out">not run yet</pre>

<script type="module">
import { createPlaybackGraph } from "./dist/src/pageworld/playback-graph.js";

const SAMPLE_RATE = 44100;
const STEM_SECONDS = 30;
const FADE_SECONDS = 4;

function wavBlobUrl(seconds, hz) {
  const n = SAMPLE_RATE * seconds;
  const buffer = new ArrayBuffer(44 + n * 2);
  const view = new DataView(buffer);
  const ascii = (offset, text) => { for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i)); };
  ascii(0, "RIFF"); view.setUint32(4, 36 + n * 2, true); ascii(8, "WAVEfmt ");
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, SAMPLE_RATE, true); view.setUint32(28, SAMPLE_RATE * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  ascii(36, "data"); view.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    view.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * hz * (i / SAMPLE_RATE)) * 8000), true);
  }
  return URL.createObjectURL(new Blob([buffer], { type: "audio/wav" }));
}

function stems(hz) {
  const n = SAMPLE_RATE * STEM_SECONDS;
  const make = scale => {
    const channels = [];
    for (let c = 0; c < 2; c++) {
      const data = new Float32Array(n);
      for (let i = 0; i < n; i++) data[i] = Math.sin(2 * Math.PI * hz * (i / SAMPLE_RATE)) * scale;
      channels.push(data);
    }
    return channels;
  };
  return { vocals: make(0.25), instrumental: make(0.25), sampleRate: SAMPLE_RATE };
}

async function run() {
  const element = document.createElement("audio");
  element.src = wavBlobUrl(60, 110);
  element.loop = true;
  element.muted = true;
  document.body.append(element);
  await element.play();

  const context = new AudioContext({ sampleRate: SAMPLE_RATE });
  await context.resume();
  const source = context.createMediaElementSource(element);
  source.connect(context.destination);

  const graph = createPlaybackGraph({ context, source });

  const deckA = stems(220);
  graph.loadStems(deckA.vocals, deckA.instrumental, deckA.sampleRate);
  graph.setMixLevel(1);

  await new Promise(r => setTimeout(r, 400));
  const beforeState = graph.describe();

  const deckB = stems(330);
  const result = graph.crossfadeTo({
    vocals: deckB.vocals,
    instrumental: deckB.instrumental,
    sampleRate: deckB.sampleRate,
    durationSeconds: FADE_SECONDS,
    incomingOffsetSeconds: 0,
  });

  const samples = [];
  const t0 = context.currentTime;
  await new Promise(resolve => {
    const timer = setInterval(() => {
      const s = graph.describe();
      samples.push({
        t: +(context.currentTime - t0).toFixed(3),
        gain0: s.decks[0].deckGain,
        gain1: s.decks[1].deckGain,
        playing0: s.decks[0].playing,
        playing1: s.decks[1].playing,
        active: s.activeDeck,
        crossfading: s.crossfading,
      });
      if (context.currentTime - t0 > FADE_SECONDS + 1.2) { clearInterval(timer); resolve(); }
    }, 40);
  });

  const after = graph.describe();
  const inFade = samples.filter(s => s.t > 0.15 && s.t < FADE_SECONDS - 0.15);
  const power = inFade.map(s => s.gain0 ** 2 + s.gain1 ** 2);
  const report = {
    crossfade: result,
    beforeActiveDeck: beforeState.activeDeck,
    afterActiveDeck: after.activeDeck,
    deckSwapped: beforeState.activeDeck !== after.activeDeck,
    gain0: { first: samples[0].gain0, last: samples[samples.length - 1].gain0 },
    gain1: { first: samples[0].gain1, last: samples[samples.length - 1].gain1 },
    constantPower: {
      min: +Math.min(...power).toFixed(4),
      max: +Math.max(...power).toFixed(4),
      worstErrorPct: +((Math.max(...power.map(p => Math.abs(p - 1)))) * 100).toFixed(2),
    },
    outgoingStillPlaying: after.decks[beforeState.activeDeck].playing,
    incomingPlaying: after.decks[after.activeDeck].playing,
    sampleCount: samples.length,
  };

  graph.dispose();
  context.close();
  window.__crossfadeSamples = samples;
  window.__crossfadeReport = report;
  document.getElementById("out").textContent = JSON.stringify(report, null, 2);
  plot(samples);
}

function plot(samples) {
  const c = document.getElementById("plot");
  const g = c.getContext("2d");
  const W = c.width, H = c.height, pad = 30;
  const span = samples[samples.length - 1].t;
  const x = t => pad + (t / span) * (W - pad * 2);
  const y = v => H - pad - v * (H - pad * 2);
  g.clearRect(0, 0, W, H);
  g.strokeStyle = "hsla(0,0%,100%,0.14)";
  for (const v of [0, 0.5, 1]) { g.beginPath(); g.moveTo(pad, y(v)); g.lineTo(W - pad, y(v)); g.stroke(); }
  const line = (key, colour) => {
    g.strokeStyle = colour; g.lineWidth = 2; g.beginPath();
    samples.forEach((s, i) => (i ? g.lineTo(x(s.t), y(s[key])) : g.moveTo(x(s.t), y(s[key]))));
    g.stroke();
  };
  line("gain0", "hsl(0,70%,65%)");
  line("gain1", "hsl(140,60%,60%)");
  g.strokeStyle = "hsla(45,100%,70%,0.8)"; g.setLineDash([4, 4]); g.beginPath();
  samples.forEach((s, i) => {
    const p = Math.sqrt(s.gain0 ** 2 + s.gain1 ** 2);
    return i ? g.lineTo(x(s.t), y(p)) : g.moveTo(x(s.t), y(p));
  });
  g.stroke(); g.setLineDash([]);
  g.fillStyle = "hsla(0,0%,100%,0.6)";
  g.fillText("red deck 0 gain, green deck 1 gain, dashed the summed power", pad, H - 8);
}

document.getElementById("run").onclick = () => {
  document.getElementById("out").textContent = "running...";
  run().catch(e => { document.getElementById("out").textContent = "FAILED: " + e.message + "\n" + e.stack; });
};
</script>
</body>
</html>
